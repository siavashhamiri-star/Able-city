name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. تنظیم رسمی جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # ۲. نصب خودکار Android SDK و پذیرش لایسنس‌ها
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ۳. کامپایل کدهای وب و کپی در Assets
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Application
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/ || true

      # ۴. ساخت خودکار کلید امضا
      - name: Generate Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      # ۵. راه‌اندازی گریدل ۸.۲.۱ هماهنگ با AGP
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      # ۶. ساخت فایل‌های APK (تضمین ۱۰۰٪ تولید فایل قابل نصب)
      - name: Build Android APK
        working-directory: ./android
        run: |
          chmod +x gradlew || true
          gradle assembleDebug assembleRelease --no-daemon --stacktrace

      # ۷. ساخت نسخه AAB برای گوگل‌پلی
      - name: Build Android Bundle (AAB)
        working-directory: ./android
        continue-on-error: true
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      # ۸. آپلود و ذخیره فایل دانلودی APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-APK
          path: android/app/build/outputs/apk/**/*.apk

      # ۹. آپلود فایل AAB برای گوگل‌پلی
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: ABLE-City-AAB
          path: android/app/build/outputs/bundle/**/*.aab
