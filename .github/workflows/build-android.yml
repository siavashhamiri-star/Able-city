name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. تنظیم جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ۲. لایسنس‌ها و ابزارهای اندروید
      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      # ۳. بیلد وب‌اپ و فایل‌های فرانت‌اند
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Application
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/ || true

      # ۴. تنظیم رسمی گریدل
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      # ۵. ساخت مستقیم APK و AAB بدون گیر کردن
      - name: Build Android Release APK & AAB
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      # ۶. دانلود خروجی‌ها
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB Artifact (Play Store)
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
