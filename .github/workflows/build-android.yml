name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. تنظیم جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ۲. بیلد فایل‌های وب
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Application
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/ || true

      # ۳. ایجاد خودکار کلید امضا و کدهای ضروری جاوا در صورت عدم وجود
      - name: Prepare Android Project & Keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          
          # ساخت پکیج و اکتیویتی اگر در ریپو نباشد
          mkdir -p android/app/src/main/java/com/ablecity/app
          cat << 'EOF' > android/app/src/main/java/com/ablecity/app/MainActivity.java
          package com.ablecity.app;

          import android.annotation.SuppressLint;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              private WebView webView;

              @Override
              @SuppressLint("SetJavaScriptEnabled")
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setDatabaseEnabled(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      # ۴. تنظیم گریدل نسخه رسمی و پایدار
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      # ۵. ساخت APK و AAB با فلگ امضا
      - name: Build Android APK and AAB
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease assembleDebug --no-daemon --stacktrace

      # ۶. ذخیره APK برای نصب روی موبایل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-APK
          path: android/app/build/outputs/apk/**/*.apk

      # ۷. ذخیره AAB برای انتشار در گوگل‌پلی
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-AAB
          path: android/app/build/outputs/bundle/**/*.aab
