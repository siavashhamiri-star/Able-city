name: Build Android APK & AAB (ABLE City)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Build Production Web App
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Ensure Gradle Wrapper Exists
        run: |
          cd android
          if [ ! -f "gradlew" ]; then
            echo "Gradle wrapper missing, generating with gradle..."
            gradle wrapper --gradle-version 8.6 || true
          fi
          chmod +x gradlew || true

      - name: Build Release APK
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            gradle assembleRelease --no-daemon --stacktrace
          fi

      - name: Build Release AAB (Android App Bundle for Google Play)
        run: |
          cd android
          if [ -f "gradlew" ]; then
            ./gradlew bundleRelease --no-daemon --stacktrace
          else
            gradle bundleRelease --no-daemon --stacktrace
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
