name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. تنظیم جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ۲. ست کردن مسیر استاندارد اندروید SDK
      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      # ۳. بیلد وب‌اپلیکیشن
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Application
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/ || true

      # ۴. راه‌اندازی Gradle 8.6
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.6

      # ۵. ساخت نهایی فایل‌های APK و AAB
      - name: Build Android Release APK & AAB
        working-directory: ./android
        run: |
          gradle assembleRelease bundleRelease --no-daemon --stacktrace

      # ۶. ذخیره فایل خروجی APK برای گوشی
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # ۷. ذخیره فایل خروجی AAB برای پلی‌استور
      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
