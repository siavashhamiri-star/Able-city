name: Build Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ۱. تنظیم جاوا ۱۷
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # ۲. نصب خودکار Android SDK و پذیرش لایسنس‌ها
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ۳. کامپایل وب‌سایت با Node.js و انتقال به Assets
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Web Application
        run: |
          npm install
          npm run build
          mkdir -p android/app/src/main/assets
          cp -r dist/* android/app/src/main/assets/ || true

      # ۴. ساخت خودکار کلید دیباگ برای رفع خطای Signing
      - name: Create Debug Keystore
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true

      # ۵. تنظیم گریدل
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.2.1

      # ۶. اجرای دستور کامپایل (ابتدا assembleDebug تا حتما APK تولید شود)
      - name: Build Android APK
        working-directory: ./android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      # ۷. ساخت نسخه Bundle برای گوگل‌پلی
      - name: Build Android Bundle (AAB)
        working-directory: ./android
        continue-on-error: true
        run: |
          gradle bundleRelease --no-daemon --stacktrace

      # ۸. ذخیره و آپلود فایل APK آماده نصب روی گوشی
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-App-APK
          path: android/app/build/outputs/apk/**/*.apk

      # ۹. ذخیره فایل AAB در صورت تولید
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ABLE-City-App-AAB
          path: android/app/build/outputs/bundle/**/*.aab
