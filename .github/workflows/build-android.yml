name: Build Android APK & AAB (ABLE City)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Web App
        run: npm run build

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x ./android/gradlew || true

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace || true

      - name: Build Release AAB (Android App Bundle for Google Play)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ABLE-City-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
